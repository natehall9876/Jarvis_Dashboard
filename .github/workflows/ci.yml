name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege by default — nothing here needs write access to the repo,
# and forked-PR workflows never see repository secrets regardless.
permissions:
  contents: read

jobs:
  build:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # `npm run typecheck` itself runs `next typegen` first (Next.js 16
        # writes route/layout/page prop types like `LayoutProps<"/">` into
        # .next/types/ — gitignored, generated on demand — and a fresh CI
        # checkout has never run `next dev`/`next build` to produce them).
        # Before this, `tsc --noEmit` alone failed here on every clean
        # checkout with "Cannot find name 'LayoutProps'" even though it
        # passed locally, where .next/types already existed on disk from a
        # prior `next dev`/`next build` run.
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        # No Supabase/AI secrets are passed here on purpose: every page and
        # data-access function degrades to an honest "not configured" state
        # rather than requiring live credentials at build time (see
        # src/lib/data/shared.ts's withDataResult). If a future change makes
        # the build require real values, add them as repository secrets and
        # reference them here — never hardcode a value in this file.
        run: npm run build

      - name: Verify no server secrets leaked into the client bundle
        # Checks the actual shipped .next/static/ output for OAuth client
        # secrets, the Supabase service-role key, webhook secrets, and
        # provider token endpoints — found and fixed once already (see
        # scripts/check-no-client-secrets.mjs's own doc comment).
        run: npm run verify:no-client-secrets
