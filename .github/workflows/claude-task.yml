name: Claude owner task

# Deliberately manual: public comments, issues and forks cannot start AI runs.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "One code task and its acceptance checks. Public code only; no customer data."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: claude-owner-task
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      github.repository == 'natehall9876/Jarvis_Dashboard' &&
      github.actor == 'natehall9876' &&
      github.triggering_actor == 'natehall9876' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check subscription authentication
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_TOKEN" ]; then
            echo "::error::Add the CLAUDE_CODE_OAUTH_TOKEN Actions secret. See docs/AI_AGENT_SETUP.md."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Implement the requested code change
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: false
          display_report: false
          prompt: |
            Work only on the checked-out Jarvis code. Read AGENTS.md, CLAUDE.md,
            and relevant docs first. Implement the one owner request below.
            Preserve source records, ownership rules and existing behavior unless
            the request explicitly changes them. Use synthetic test data only.
            Do not access customer systems, deploy, send messages, handle live
            credentials, commit, push, open a PR, or merge. Do not edit .github,
            .claude, .mcp.json, .env files or dependency/lock files. If the task
            requires any of those, explain the dependency and stop.
            The workflow will validate your working-tree changes and open a
            draft PR. State incomplete work honestly; never claim live testing.

            OWNER REQUEST:
            ${{ inputs.task }}
          claude_args: >-
            --permission-mode acceptEdits
            --max-turns 25
            --max-budget-usd 2.00
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(npm run typecheck),Bash(npm run lint),Bash(npm run test:isolated)"
            --disallowedTools "Bash(git add:*),Bash(git rm:*),Bash(git commit:*),Bash(git push:*),Bash(gh:*),WebSearch,WebFetch"

      - name: Check changed paths
        id: changes
        run: |
          git add --all
          python3 - <<'PY'
          import os, subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          paths = [p for p in paths if p]
          allowed = ('src/', 'docs/', 'e2e/', 'e2e-live/', 'scripts/')
          blocked = [p for p in paths if not p.startswith(allowed) or any(x.startswith('.env') for x in p.split('/'))]
          if blocked:
              raise SystemExit('Changes outside the task allowlist; no branch published: ' + ', '.join(blocked))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('changed=' + str(bool(paths)).lower() + '\n')
          PY
          git diff --cached --check

      - name: Validate changes without production credentials
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npm run verify:no-client-secrets
          npm run test:isolated
          npm run test:ownership:db
          npm run test:activity
          npm run test:intelligence
          npm run test:native-inserts

      - name: Publish a draft pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="claude/owner-task-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Implement owner task ${GITHUB_RUN_ID}"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          body_file="$RUNNER_TEMP/claude-pr-body.md"
          printf '%s\n' \
            'Implements the manually requested owner code task. Review the diff before merging.' \
            '' \
            'Validation: typecheck, lint, build, client-secret check, isolated integration tests, ownership DB tests, activity, intelligence, and native insert tests passed in this run.' \
            '' \
            "Evidence: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '' \
            'Production and physical-device testing were not performed. This draft is never merged automatically.' \
            'Because this uses GITHUB_TOKEN, the resulting PR does not automatically trigger another CI run; use the linked validation run as evidence.' > "$body_file"
          gh pr create --base main --head "$branch" --draft \
            --title "Owner task ${GITHUB_RUN_ID}" --body-file "$body_file"

      - name: Report no changes
        if: steps.changes.outputs.changed == 'false'
        run: echo 'No publishable changes were produced. Inspect the Claude step before retrying.'
